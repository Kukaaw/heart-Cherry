<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>I Love You</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;overscroll-behavior:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;background:#000}
</style>
</head>
<body>
<canvas id="c" role="img" aria-label="Heart made of the words I love you"></canvas>
<script>
(() => {
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const TAU = Math.PI * 2;
  const FAM = '"Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';
  const WORDS = ['I love you', 'Love You', 'LOVE YOU', 'love you', 'I Love You'];
  // [hue, sat, light] — cherry: from deep wine-cherry to bright cherry-pink
  const COLORS = [[346, 88, 42], [348, 92, 50], [350, 95, 58], [352, 100, 67], [356, 100, 78]];

  // parametric heart
  const hx = t => 16 * Math.pow(Math.sin(t), 3);
  const hy = t => -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
  const CY = -2.5;

  let W, H, dpr, cx, cy, sprites, parts, t0;

  function makeSprites(font) {
    sprites = [];
    const m = document.createElement('canvas').getContext('2d');
    m.font = `500 ${font}px ${FAM}`;
    WORDS.forEach(word => {
      const tw = Math.ceil(m.measureText(word).width);
      const pad = Math.ceil(font * 0.8);
      const w = tw + pad * 2, h = Math.ceil(font * 1.3) + pad * 2;
      const row = [];
      COLORS.forEach(([hh, s, l]) => {
        const c = document.createElement('canvas');
        c.width = Math.ceil(w * dpr); c.height = Math.ceil(h * dpr);
        const g = c.getContext('2d');
        g.scale(dpr, dpr);
        g.font = `500 ${font}px ${FAM}`;
        g.textAlign = 'center'; g.textBaseline = 'middle';
        g.shadowColor = `hsla(${hh},100%,55%,.95)`;
        g.shadowBlur = font * 0.9;
        g.fillStyle = `hsl(${hh} ${s}% ${l}%)`;
        g.fillText(word, w / 2, h / 2);          // soft halo
        g.shadowBlur = font * 0.25;
        g.fillText(word, w / 2, h / 2);          // crisp bright core
        row.push({ c, w, h });
      });
      sprites.push(row);
    });
  }

  function build(keep) {
    W = innerWidth; H = innerHeight;
    dpr = Math.min(devicePixelRatio || 1, 2);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    cx = W / 2; cy = H / 2;
    const u = Math.min(W * 0.9 / 34, H * 0.72 / 31);
    const font = Math.max(9, u * 0.55);
    makeSprites(font);

    const dens = Math.min(1, u / 16 + 0.45);
    // [scale, count, outline?]
    const rings = [
      [1.00, 150, 1], [0.93, 142, 1], [0.86, 132, 1], [0.79, 122, 1],
      [0.67, 90], [0.54, 70], [0.41, 48], [0.28, 30], [0.14, 12]
    ];
    parts = [];
    rings.forEach(([s, n, outline], ri) => {
      n = Math.round(n * dens);
      const ph0 = Math.random() * TAU;
      for (let i = 0; i < n; i++) {
        const t = (i / n) * TAU + rnd(-0.015, 0.015);
        const j = outline ? 0.25 : 0.7;
        const x = cx + (hx(t) * s + rnd(-j, j)) * u;
        const y = cy + ((hy(t) - CY) * s + CY + rnd(-j, j)) * u;
        // outline sweeps around the heart from the bottom tip, then the inside fills
        const sweep = (((t - Math.PI) % TAU) + TAU) % TAU / TAU;
        const delay = outline ? 400 + sweep * 6500 + rnd(0, 1200) + ri * 120
                              : 8000 + rnd(0, 5500);
        const ci = Math.min(COLORS.length - 1, (Math.random() ** 1.4 * COLORS.length) | 0);
        const sp = sprites[(Math.random() * WORDS.length) | 0][ci];
        const k = rnd(0.85, 1.15);
        parts.push({
          x, y, sp, k, delay,
          base: (outline ? rnd(0.55, 1) : rnd(0.3, 0.75)),
          ph: rnd(0, TAU), fs: rnd(0.0012, 0.0042), dr: rnd(0, TAU)
        });
      }
    });
    if (!keep) t0 = performance.now();
  }

  function frame(now) {
    const el = now - t0;
    const k = reduce ? 1 : 1 + 0.03 * Math.sin(now / 7000 * TAU);   // slow breathing
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, cv.width, cv.height);
    ctx.setTransform(dpr * k, 0, 0, dpr * k, cx * dpr * (1 - k), cy * dpr * (1 - k));
    for (let i = 0; i < parts.length; i++) {
      const p = parts[i];
      let a = (el - p.delay) / 1500;
      if (a <= 0) continue;
      if (a > 1) a = 1;
      const fl = reduce ? 1 : 0.68 + 0.32 * Math.sin(now * p.fs + p.ph);
      ctx.globalAlpha = a * a * p.base * fl;
      const w = p.sp.w * p.k, h = p.sp.h * p.k;
      const dx = reduce ? 0 : Math.sin(now * 0.0006 + p.dr) * 0.8;
      ctx.drawImage(p.sp.c, p.x + dx - w / 2, p.y - h / 2, w, h);
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }

  build(false);
  requestAnimationFrame(frame);

  // rebuild only when the width really changes (phone address-bar resizes must not restart or skip the intro)
  let tm, lastW = innerWidth;
  addEventListener('resize', () => {
    clearTimeout(tm);
    tm = setTimeout(() => {
      if (Math.abs(innerWidth - lastW) < 2) return;
      lastW = innerWidth;
      build(true);
    }, 200);
  });
})();
</script>
</body>
</html>
